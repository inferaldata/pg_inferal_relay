name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Test (PostgreSQL ${{ matrix.pg }})
        run: make test PG=${{ matrix.pg }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build TLE artifact
        run: make tle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sql/pg_inferal_relay--0.1.0.sql
            dist/pg_inferal_relay--0.1.0-tle.sql
          generate_release_notes: true
